<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Service Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="booking-container">
        <h2>Car Service Booking</h2>
        <form id="bookingForm">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="tel" id="phone" placeholder="Phone Number (10 Digits)" required pattern="[0-9]{10}">
            <input type="text" id="car_model" placeholder="Vehicle Model / Car" required>
            <input type="date" id="service_date" required>
            <select id="service_type" required>
                <option value="Full Service">Full Service</option>
                <option value="Tyre Change">Tyre Change</option>
                <option value="Oil Change">Oil Change</option>
                <option value="Washing">Washing</option>
            </select>
            <button type="submit" id="submitBtn">SUBMIT BOOKING</button>
        </form>
    </div>

    <script>
        const BACKEND_URL = "https://car-service-management-backend.onrender.com/api/bookings";

        document.getElementById("bookingForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById("submitBtn");
            submitBtn.innerText = "SUBMITTING...";
            submitBtn.disabled = true;

            const formData = {
                name: document.getElementById("name").value,
                phone: document.getElementById("phone").value,
                car_model: document.getElementById("car_model").value,
                service_date: document.getElementById("service_date").value,
                service_type: document.getElementById("service_type").value
            };

            try {
                const response = await fetch(BACKEND_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    alert("Booking Submitted Successfully!");
                    document.getElementById("bookingForm").reset();
                } else {
                    const errData = await response.json();
                    alert("Error: " + (errData.error || "Failed to submit booking"));
                }
            } catch (error) {
                alert("Server connection error! Please wait a moment while backend connects.");
            } finally {
                submitBtn.innerText = "SUBMIT BOOKING";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
