<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Service Management - Services & Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-wrapper">
        <!-- Range of Services Section -->
        <h2 class="section-title">CHOOSE FROM A RANGE OF <span>PREMIUM SERVICES</span></h2>
        
        <div class="services-grid">
            <div class="service-card" onclick="selectService('Paint Protection Film (PPF)')">
                <img src="https://images.unsplash.com/photo-1619642751034-765dfdf7c58e?q=80&w=600&auto=format&fit=crop" alt="PPF">
                <div class="service-card-info">
                    <h3>Paint Protection Film</h3>
                    <span class="arrow">↗</span>
                </div>
            </div>

            <div class="service-card" onclick="selectService('Ceramic & Graphene Coating')">
                <img src="https://images.unsplash.com/photo-1607860108855-64acf2078ed9?q=80&w=600&auto=format&fit=crop" alt="Ceramic Coating">
                <div class="service-card-info">
                    <h3>Ceramic & Graphene Coating</h3>
                    <span class="arrow">↗</span>
                </div>
            </div>

            <div class="service-card" onclick="selectService('Wheel Alignment')">
                <img src="https://images.unsplash.com/photo-1580273916550-e323be2ae537?q=80&w=600&auto=format&fit=crop" alt="Wheel Alignment">
                <div class="service-card-info">
                    <h3>Wheel Alignment</h3>
                    <span class="arrow">↗</span>
                </div>
            </div>

            <div class="service-card" onclick="selectService('Full Body Painting')">
                <img src="https://images.unsplash.com/photo-1625047509168-a7026f36de04?q=80&w=600&auto=format&fit=crop" alt="Painting">
                <div class="service-card-info">
                    <h3>Full Body Painting</h3>
                    <span class="arrow">↗</span>
                </div>
            </div>

            <div class="service-card" onclick="selectService('Denting & Repair')">
                <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=600&auto=format&fit=crop" alt="Denting Repair">
                <div class="service-card-info">
                    <h3>Denting & Repair</h3>
                    <span class="arrow">↗</span>
                </div>
            </div>

            <div class="service-card" onclick="selectService('Sound Damping')">
                <img src="https://images.unsplash.com/photo-1542282088-72c9c27ed0cd?q=80&w=600&auto=format&fit=crop" alt="Sound Damping">
                <div class="service-card-info">
                    <h3>Sound Damping</h3>
                    <span class="arrow">↗</span>
                </div>
            </div>

            <div class="service-card" onclick="selectService('Air Filter & AC Check')">
                <img src="https://images.unsplash.com/photo-1486006920555-c77dce18193b?q=80&w=600&auto=format&fit=crop" alt="AC Service">
                <div class="service-card-info">
                    <h3>Air Filter & AC Check</h3>
                    <span class="arrow">↗</span>
                </div>
            </div>

            <div class="service-card" onclick="selectService('Full Service')">
                <img src="https://images.unsplash.com/photo-1487754180451-c456f719a1fc?q=80&w=600&auto=format&fit=crop" alt="Full Service">
                <div class="service-card-info">
                    <h3>Full Service</h3>
                    <span class="arrow">↗</span>
                </div>
            </div>
        </div>

        <!-- Booking Form Section -->
        <div class="booking-container" id="bookingFormSection">
            <div class="brand-header">
                <h1>CAR SERVICE MANAGEMENT</h1>
                <p>PREMIUM AUTOMOTIVE CARE & DETAILING</p>
            </div>

            <form id="bookingForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name" required>
                </div>
                
                <div class="form-group">
                    <label for="phone">Contact Number</label>
                    <input type="tel" id="phone" placeholder="10 Digit Mobile Number" required pattern="[0-9]{10}">
                </div>
                
                <div class="form-group">
                    <label for="car_model">Vehicle & Model</label>
                    <input type="text" id="car_model" placeholder="e.g. Tata Harrier, Fortuner" required>
                </div>
                
                <div class="form-group">
                    <label for="service_date">Appointment Date</label>
                    <input type="date" id="service_date" required>
                </div>
                
                <div class="form-group">
                    <label for="service_type">Select Service Required</label>
                    <select id="service_type" required>
                        <option value="Paint Protection Film (PPF)">Paint Protection Film (PPF)</option>
                        <option value="Ceramic & Graphene Coating">Ceramic & Graphene Coating</option>
                        <option value="Wheel Alignment">Wheel Alignment</option>
                        <option value="Full Body Painting">Full Body Painting</option>
                        <option value="Denting & Repair">Denting & Repair</option>
                        <option value="Sound Damping">Sound Damping</option>
                        <option value="Air Filter & AC Check">Air Filter & AC Check</option>
                        <option value="Tyre Change">Tyre Change</option>
                        <option value="Full Service">Full Service</option>
                        <option value="Oil Change">Oil Change</option>
                        <option value="Washing & Detailing">Washing & Detailing</option>
                    </select>
                </div>
                
                <button type="submit" id="submitBtn">BOOK APPOINTMENT</button>
            </form>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://car-service-management-backend.onrender.com/api/bookings";

        function selectService(serviceName) {
            const selectElement = document.getElementById("service_type");
            selectElement.value = serviceName;
            document.getElementById("bookingFormSection").scrollIntoView({ behavior: 'smooth' });
        }

        document.getElementById("bookingForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById("submitBtn");
            const originalText = submitBtn.innerText;
            submitBtn.innerText = "SUBMITTING...";
            submitBtn.disabled = true;

            const formData = {
                name: document.getElementById("name").value,
                phone: document.getElementById("phone").value,
                car_model: document.getElementById("car_model").value,
                service_date: document.getElementById("service_date").value,
                service_type: document.getElementById("service_type").value
            };

            try {
                const response = await fetch(BACKEND_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    alert("Booking Request Submitted Successfully!");
                    document.getElementById("bookingForm").reset();
                } else {
                    const errData = await response.json();
                    alert("Error: " + (errData.error || "Failed to submit booking"));
                }
            } catch (error) {
                alert("Server connection error! Please wait a moment while backend connects.");
            } finally {
                submitBtn.innerText = originalText;
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
