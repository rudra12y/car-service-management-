<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Car Service</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .container { max-width: 900px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); text-align: left; }
        th { color: #00d4ff; font-family: 'Orbitron', sans-serif; }
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.85rem; }
        .Pending { background: #ffaa00; color: #000; }
        .In-Progress { background: #00d4ff; color: #000; }
        .Completed { background: #00ff88; color: #000; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Admin Dashboard</h1>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Customer Name</th>
                    <th>Phone</th>
                    <th>Vehicle</th>
                    <th>Service</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="bookingsTable">
                <!-- Live data will load here -->
            </tbody>
        </table>
    </div>

    <script>
        const API_URL = "https://car-service-management.onrender.com/api/bookings";

        async function fetchBookings() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                const tableBody = document.getElementById('bookingsTable');
                tableBody.innerHTML = '';

                data.forEach(item => {
                    const statusClass = item.status.replace(" ", "-");
                    tableBody.innerHTML += `
                        <tr>
                            <td>#${item.id}</td>
                            <td>${item.customerName}</td>
                            <td>${item.phone}</td>
                            <td>${item.carModel}</td>
                            <td>${item.serviceType}</td>
                            <td><span class="badge ${statusClass}">${item.status}</span></td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Error fetching bookings:", error);
            }
        }

        // Initial Load
        fetchBookings();

        // Auto Refresh every 3 seconds for Live Updates
        setInterval(fetchBookings, 3000);
    </script>
</body>
</html>
