<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Car Service</title>
    <link rel="stylesheet" href="style.css?v=8">
    <style>
        .container { max-width: 950px; width: 95%; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; border: 1px solid rgba(255, 255, 255, 0.2); text-align: left; font-size: 0.85rem; }
        th { background: rgba(0, 212, 255, 0.2); color: #00d4ff; }
        .status-btn {
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.8rem;
            cursor: pointer;
            border: none;
            color: #fff;
        }
        .btn-completed { background: #00c853; }
        .btn-pending { background: #ff9100; }
        .badge-waiting { color: #ff3d00; font-weight: bold; }
        .badge-pending { color: #ffaa00; font-weight: bold; }
        .badge-completed { color: #00ff66; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Service Bookings Admin Dashboard</h1>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Customer Name</th>
                    <th>Phone</th>
                    <th>Car Model</th>
                    <th>Date</th>
                    <th>Service</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="bookingTableBody">
                <!-- Bookings loaded dynamically -->
            </tbody>
        </table>
    </div>

    <script>
        const API_URL = "https://car-service-management-backend.onrender.com/api/bookings";
        const TOGGLE_URL = "https://car-service-management-backend.onrender.com/api/toggle-status";

        async function fetchBookings() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                const tbody = document.getElementById('bookingTableBody');
                tbody.innerHTML = '';

                data.forEach((booking, index) => {
                    let statusHtml = '';
                    if (booking.status === 'Completed') {
                        statusHtml = `<span class="badge-completed">✅ Completed</span>`;
                    } else if (booking.status === 'Waiting') {
                        statusHtml = `<span class="badge-waiting">🛑 Waiting List</span>`;
                    } else {
                        statusHtml = `<span class="badge-pending">⏳ Pending</span>`;
                    }

                    const btnClass = booking.status === 'Completed' ? 'btn-pending' : 'btn-completed';
                    const btnText = booking.status === 'Completed' ? 'Mark Pending' : 'Mark Complete';

                    const row = `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${booking.customerName}</td>
                            <td>${booking.phone}</td>
                            <td>${booking.carModel}</td>
                            <td>${booking.bookingDate || 'N/A'}</td>
                            <td>${booking.serviceType}</td>
                            <td>${statusHtml}</td>
                            <td>
                                <button class="status-btn ${btnClass}" onclick="toggleStatus(${index})">${btnText}</button>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } catch (err) {
                console.error("Error fetching data:", err);
            }
        }

        async function toggleStatus(index) {
            try {
                await fetch(`${TOGGLE_URL}/${index}`, { method: 'POST' });
                fetchBookings();
            } catch (err) {
                alert("Status update failed!");
            }
        }

        fetchBookings();
        setInterval(fetchBookings, 3000);
    </script>
</body>
</html>
