<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin CMS - Automotiv Studio Bardoli</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .table-box { overflow-x: auto; background: #111111; border: 1px solid #262626; border-radius: 10px; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 15px 18px; border-bottom: 1px solid #222222; font-size: 13px; }
        th { background: #1a1a1a; color: #f5b800; text-transform: uppercase; font-size: 12px; }
        .badge { padding: 5px 10px; border-radius: 4px; font-size: 11px; font-weight: 800; text-transform: uppercase; }
        .badge-Pending { background: rgba(245, 184, 0, 0.15); color: #f5b800; }
        .badge-Completed { background: rgba(16, 185, 129, 0.15); color: #10b981; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo"><span>AUTO</span>MOTIV ADMIN</a>
        <div class="top-actions">
            <a href="index.html" class="btn-outline-sm">View Website</a>
            <button onclick="logout()" class="btn-yellow-sm" style="border:none; cursor:pointer;">Logout</button>
        </div>
    </nav>

    <section class="section-pad">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px;">
            <h2 class="sec-heading" style="margin-bottom:0;">CUSTOMER <span class="yellow-text">SERVICE BOOKINGS</span></h2>
            <button onclick="loadBookings()" class="btn-yellow">Refresh List</button>
        </div>

        <div class="table-box">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Customer Name</th>
                        <th>Phone</th>
                        <th>Car Model</th>
                        <th>Service Package</th>
                        <th>Appointment Date</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="bookingsTable">
                    <tr><td colspan="8" style="text-align:center; color:#888;">Loading bookings...</td></tr>
                </tbody>
            </table>
        </div>
    </section>

    <script>
        const API_URL = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost"
            ? "http://127.0.0.1:5000/api/bookings"
            : "https://car-service-management-backend.onrender.com/api/bookings";

        const user = JSON.parse(localStorage.getItem("studioUser"));

        if (!user || user.role !== "admin") {
            alert("Admin access only! Please login with admin@garage.com");
            window.location.href = "login.html";
        }

        function logout() {
            localStorage.removeItem("studioUser");
            window.location.href = "login.html";
        }

        async function loadBookings() {
            const tbody = document.getElementById("bookingsTable");
            try {
                const res = await fetch(API_URL);
                const data = await res.json();

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; color:#888; padding:30px;">No bookings yet.</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(b => `
                    <tr>
                        <td>#${b.id}</td>
                        <td><strong>${b.customer_name}</strong></td>
                        <td>${b.phone}</td>
                        <td>${b.car_model}</td>
                        <td style="color:#f5b800; font-weight:700;">${b.service_type}</td>
                        <td>${b.service_date}</td>
                        <td><span class="badge badge-${b.status}">${b.status}</span></td>
                        <td>
                            ${b.status === 'Pending' 
                                ? `<button class="btn-yellow-sm" style="border:none; cursor:pointer;" onclick="markComplete(${b.id})">Mark Done</button>` 
                                : '<span style="color:#10b981; font-weight:700;">✔ Completed</span>'}
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; color:#ff4d4d; padding:25px;">Server waking up... Click Refresh List in 15 seconds.</td></tr>';
            }
        }

        async function markComplete(id) {
            await fetch(`${API_URL}/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ status: "Completed" })
            });
            loadBookings();
        }

        loadBookings();
    </script>
</body>
</html>
