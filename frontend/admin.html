<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Car Service Management</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(20, 23, 29, 0.9);
            border: 1px solid #282d38;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 13px;
            color: #8a94a6;
            text-transform: uppercase;
        }

        .stat-card p {
            font-size: 28px;
            font-weight: 700;
            color: #ff5500;
            margin-top: 5px;
        }

        .table-responsive {
            background: rgba(20, 23, 29, 0.95);
            border: 1px solid rgba(255, 85, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #282d38;
            font-size: 14px;
        }

        th {
            color: #ff5500;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-pending {
            background: rgba(255, 170, 0, 0.2);
            color: #ffaa00;
            border: 1px solid #ffaa00;
        }

        .status-completed {
            background: rgba(0, 230, 118, 0.2);
            color: #00e676;
            border: 1px solid #00e676;
        }

        .refresh-btn {
            background: #ff5500;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            float: right;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            background: #e04b00;
        }
    </style>
</head>
<body>

    <div class="main-wrapper admin-container">
        <div class="brand-header">
            <h1>ADMIN DASHBOARD</h1>
            <p>CUSTOMER BOOKINGS & MANAGEMENT SYSTEM</p>
        </div>

        <button class="refresh-btn" onclick="fetchBookings()">🔄 Refresh Bookings</button>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Bookings</h3>
                <p id="totalCount">0</p>
            </div>
            <div class="stat-card">
                <h3>Pending Services</h3>
                <p id="pendingCount" style="color: #ffaa00;">0</p>
            </div>
            <div class="stat-card">
                <h3>Completed</h3>
                <p id="completedCount" style="color: #00e676;">0</p>
            </div>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Car Model</th>
                        <th>Date</th>
                        <th>Service Type</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="bookingTableBody">
                    <tr>
                        <td colspan="7" style="text-align: center; color: #8a94a6;">Loading bookings...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://car-service-management-backend.onrender.com/api/bookings";

        async function fetchBookings() {
            const tableBody = document.getElementById("bookingTableBody");
            tableBody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #8a94a6;">Loading bookings...</td></tr>`;

            try {
                const response = await fetch(BACKEND_URL);
                if (response.ok) {
                    const data = await response.json();
                    renderTable(data);
                } else {
                    tableBody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #ff5500;">Failed to fetch bookings!</td></tr>`;
                }
            } catch (error) {
                tableBody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #ff5500;">Server connection error!</td></tr>`;
            }
        }

        function renderTable(bookings) {
            const tableBody = document.getElementById("bookingTableBody");
            tableBody.innerHTML = "";

            let total = bookings.length;
            let pending = 0;
            let completed = 0;

            if (total === 0) {
                tableBody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #8a94a6;">No bookings found yet.</td></tr>`;
                updateStats(0, 0, 0);
                return;
            }

            bookings.forEach((b, index) => {
                const isPending = (b.status || "Pending") === "Pending";
                if (isPending) pending++; else completed++;

                const statusClass = isPending ? "status-pending" : "status-completed";

                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td><strong>${b.name}</strong></td>
                    <td><a href="tel:${b.phone}" style="color:#ff5500; text-decoration:none;">${b.phone}</a></td>
                    <td>${b.car_model}</td>
                    <td>${b.service_date}</td>
                    <td>${b.service_type}</td>
                    <td><span class="status-badge ${statusClass}">${b.status || "Pending"}</span></td>
                `;
                tableBody.appendChild(row);
            });

            updateStats(total, pending, completed);
        }

        function updateStats(total, pending, completed) {
            document.getElementById("totalCount").innerText = total;
            document.getElementById("pendingCount").innerText = pending;
            document.getElementById("completedCount").innerText = completed;
        }

        // Auto load on page start
        fetchBookings();
    </script>
</body>
</html>
